services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coocker
      MYSQL_USER: coocker
      MYSQL_PASSWORD: coocker
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucoocker", "-pcoocker"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
